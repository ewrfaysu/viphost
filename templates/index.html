<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MULTI BOT HOST</title>

<!-- Fonts & Socket.IO -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<style>

/* =====================================
   GLOBAL RESET & RESPONSIVE CORE
===================================== */
:root {
    --bg-main: #0b1f3a;
    --card-bg: #101828;
    --card-border: rgba(255, 255, 255, 0.1);
    --card-inner: #0b1324;
    --text-primary: #f1f5f9;
    --text-muted: #94a3b8;
    --accent-blue: #2563eb;
    --accent-green: #10b981;
    --accent-red: #ef4444;
    --accent-amber: #f59e0b;
    --accent-deeppink: #db2777; /* Deep Pink Accent */
}

html {
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
}

*{
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent !important;
}

body{
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    touch-action: manipulation;
}

.container{
    width: 100%;
    max-width: 950px;
    margin: 0 auto;
    padding: 16px 14px;
    overflow-x: hidden; /* Prevents outer scroll */
}


/* =====================================
   STABLE BUTTON SYSTEM (NO MOVEMENT)
===================================== */

button {
    position: relative;
    cursor: pointer;
    outline: none !important;
    border: 1px solid transparent;
    user-select: none;
    font-family: inherit;
    transition: background-color 0.15s ease, opacity 0.15s ease;
    box-shadow: none !important;
    will-change: opacity, background-color;
}

button:active {
    opacity: 0.8 !important;
}

button:focus,
button:focus-visible {
    outline: none !important;
    box-shadow: none !important;
}


/* =====================================
   HEADER BAR
===================================== */

.header-box{
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.brand{
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon{
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 20px;
    flex-shrink: 0;
}

.header-title h2{
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
}

.header-title p{
    margin: 3px 0 0;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
}

.logout{
    padding: 10px 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    color: #e2e8f0;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
}


/* =====================================
   STATS OVERVIEW
===================================== */

.stats{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

.stat-card{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    min-width: 0;
}

.stat-icon{
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    font-size: 16px;
    background: var(--card-inner);
    border: 1px solid var(--card-border);
}

.stat-info{
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
}

.stat-label{
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.stat-number{
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
}

.total .stat-number{ color: #cbd5e1; }
.running-stat .stat-number{ color: var(--accent-green); }
.stopped-stat .stat-number{ color: var(--accent-red); }


/* =====================================
   CARDS & UPLOAD SECTION
===================================== */

.card{
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    width: 100%;
    overflow: hidden;
}

.upload-box h3{
    margin: 0 0 10px;
    font-size: 15px;
    font-weight: 700;
    color: #f1f5f9;
}

.file-input{
    width: 100%;
    padding: 11px 12px;
    background: var(--card-inner);
    color: #cbd5e1;
    border: 1px dashed rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    margin-bottom: 10px;
    font-size: 13px;
    outline: none;
}

.upload{
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--accent-blue);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
}


/* =====================================
   BOT ITEM & ACTIONS
===================================== */

.bot-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}

.bot-title{
    min-width: 0;
}

.bot-title h3{
    margin: 0 0 3px;
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    word-break: break-word;
}

.bot-id{
    color: var(--text-muted);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
}

.status{
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(148, 163, 184, 0.12);
    color: #94a3b8;
    border: 1px solid rgba(148, 163, 184, 0.25);
    white-space: nowrap;
    flex-shrink: 0;
}

.status.running{
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.3);
}

.status.crashed{
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
}

.file-select-group{
    display: flex;
    gap: 8px;
    align-items: center;
    width: 100%;
}

select{
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card-inner);
    color: #f1f5f9;
    outline: none;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
}

/* BLUE EDIT BUTTON STYLING */
.edit-btn-trigger{
    padding: 10px 14px;
    background: #3b82f6;
    border: 1px solid #2563eb;
    border-radius: 10px;
    color: #ffffff;
    font-weight: 700;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
}


/* =====================================
   ACTION BUTTONS (INCREASED HEIGHT)
===================================== */

.actions{
    display: flex;
    flex-direction: row;
    gap: 8px;
    margin-top: 14px;
    width: 100%;
}

.actions button{
    flex: 1;
    min-width: 0;
    padding: 15px 4px; /* Increased vertical height for desktop */
    border: 0;
    border-radius: 10px;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 700;
    font-size: 12px;
    overflow: hidden;
}

.actions button span:last-child {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.start{ background: #16a34a !important; }
.stop{ background: #dc2626 !important; }
.restart{ background: #d97706 !important; }

/* DEEP PINK DELETE BUTTON STYLING */
.delete{ background: #db2777 !important; }

.btn-icon{
    font-size: 13px;
    line-height: 1;
    flex-shrink: 0;
}


/* =====================================
   LIVE CONSOLE
===================================== */

.live-console{
    margin-top: 14px;
    background: #030712;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    width: 100%;
}

.console-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: #0b0f19;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 11px;
    font-weight: 700;
    color: #64748b;
}

.console-live{
    color: var(--text-muted);
    font-size: 11px;
}

.console-live.active{ color: var(--accent-green); }

.console{
    margin: 0;
    padding: 10px 12px;
    height: 150px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: #4ade80;
    background: #030712;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.5;
}


/* =====================================
   MODAL EDITOR (NO SCROLL SHIFT)
===================================== */

.modal-overlay{
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    background: rgba(3, 7, 18, 0.85);
    backdrop-filter: blur(4px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-y: auto;
}

.modal-overlay.active{ display: flex; }

.modal-content{
    width: 100%;
    max-width: 800px;
    background: #0b1324;
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    padding: 16px;
    margin: auto;
}

.modal-header{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 8px;
}

.modal-title{ 
    font-size: 14px; 
    font-weight: 700; 
    color: #f1f5f9; 
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.modal-close{ 
    background: transparent; 
    border: 0; 
    color: var(--text-muted); 
    font-size: 18px; 
    cursor: pointer; 
}

.modal-editor{
    width: 100%;
    height: 300px;
    background: #030712;
    color: #38bdf8;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    padding: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    outline: none;
    resize: none;
    line-height: 1.4;
}

.modal-actions{
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 12px;
}

.btn-modal-save{ 
    padding: 9px 16px; 
    background: #16a34a; 
    border: 0; 
    border-radius: 8px; 
    color: #fff; 
    font-weight: 700; 
    font-size: 12px; 
}

.btn-modal-cancel{ 
    padding: 9px 16px; 
    background: rgba(255, 255, 255, 0.06); 
    border: 1px solid var(--card-border); 
    border-radius: 8px; 
    color: #cbd5e1; 
    font-weight: 600; 
    font-size: 12px; 
}

.empty{ 
    text-align: center; 
    padding: 30px; 
    color: var(--text-muted); 
    font-size: 14px;
}

/* =====================================
   MOBILE RESPONSIVE (STRICT BOUNDS)
===================================== */

@media(max-width: 600px){
    .container { padding: 10px 8px; }
    .header-box { padding: 12px; }
    .header-title h2 { font-size: 14px; }
    .stat-label{ font-size: 8px; }
    .stat-number{ font-size: 15px; }
    
    /* Keep single line on mobile with compact padding and dynamic scaling */
    .actions { 
        gap: 4px;
    }
    
    .actions button {
        padding: 13px 2px; /* Increased vertical height for mobile */
        font-size: 10px;
        gap: 2px;
    }

    .btn-icon {
        font-size: 11px;
    }
}

</style>
</head>

<body>

<div class="container">

<!-- HEADER BAR -->
<div class="header-box">
    <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="header-title">
            <h2>MULTI BOT HOSTING</h2>
            <p>enterprise control panel</p>
        </div>
    </div>
    <a href="/logout" style="text-decoration:none;">
        <button class="logout" type="button">LOGOUT</button>
    </a>
</div>

<!-- COMPACT STATS -->
<div class="stats">
    <div class="stat-card total">
        <div class="stat-icon">🤖</div>
        <div class="stat-info">
            <span class="stat-label">Total</span>
            <span class="stat-number" id="totalBots">0</span>
        </div>
    </div>
    <div class="stat-card running-stat">
        <div class="stat-icon">🟢</div>
        <div class="stat-info">
            <span class="stat-label">Run</span>
            <span class="stat-number" id="runningBots">0</span>
        </div>
    </div>
    <div class="stat-card stopped-stat">
        <div class="stat-icon">🔴</div>
        <div class="stat-info">
            <span class="stat-label">Stop</span>
            <span class="stat-number" id="stoppedBots">0</span>
        </div>
    </div>
</div>

<!-- UPLOAD CARD -->
<div class="card upload-box">
    <h3>📦 Upload Bot Source</h3>
    <form id="uploadForm">
        <input class="file-input" type="file" name="file" accept=".py,.zip" required>
        <button class="upload" type="submit">💾 Upload .py / .zip Package</button>
    </form>
</div>

<!-- BOT LIST CONTAINER -->
<div id="bots"></div>

</div>

<!-- FILE EDITOR MODAL -->
<div class="modal-overlay" id="editorModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="modalFileName">Editing File</div>
            <button class="modal-close" onclick="closeEditorModal()">✖</button>
        </div>
        <textarea class="modal-editor" id="modalFileCode" placeholder="Loading code content..."></textarea>
        <div class="modal-actions">
            <button class="btn-modal-cancel" onclick="closeEditorModal()">Cancel</button>
            <button class="btn-modal-save" onclick="saveModalCode()">Save & Replace</button>
        </div>
    </div>
</div>

<script>
let bots = {{ bots|tojson }};
let currentEditingBotId = null;
let currentEditingFileName = null;
let scrollYPosition = 0;

const socket = io();

function escapeHTML(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function updateBotStats(){
    const total = bots.length;
    let running = 0;
    let stopped = 0;

    bots.forEach(bot => {
        const status = String(bot.status || "").toUpperCase();
        if(status === "RUNNING") running++;
        else stopped++;
    });

    if(document.getElementById("totalBots")) document.getElementById("totalBots").textContent = total;
    if(document.getElementById("runningBots")) document.getElementById("runningBots").textContent = running;
    if(document.getElementById("stoppedBots")) document.getElementById("stoppedBots").textContent = stopped;
}

function renderBots(){
    const box = document.getElementById("bots");

    if(!bots.length){
        box.innerHTML = `
            <div class="card empty">
                <div style="font-size:28px; margin-bottom:8px;">📦</div>
                No active bot deployments found. Upload a file above to begin.
            </div>`;
        updateBotStats();
        return;
    }

    box.innerHTML = bots.map(bot => `
        <div class="card" id="bot-${bot.id}">
            <div class="bot-head">
                <div class="bot-title">
                    <h3>${escapeHTML(bot.name)}</h3>
                    <div class="bot-id">id:${escapeHTML(bot.id)}</div>
                </div>
                <span id="status-${bot.id}" class="status ${
                    bot.status === "RUNNING" ? "running" : bot.status === "CRASHED" ? "crashed" : ""
                }">
                    ${escapeHTML(bot.status)}
                </span>
            </div>

            <div class="file-select-group">
                <select id="entry-${bot.id}"></select>
                <button type="button" class="edit-btn-trigger" onclick="openEditorModal('${bot.id}')">📄 Edit File</button>
            </div>

            <div class="actions">
                <button class="start" onclick="botAction('${bot.id}', 'start')">
                    <span class="btn-icon">▶️</span>
                    <span>START</span>
                </button>
                <button class="stop" onclick="botAction('${bot.id}', 'stop')">
                    <span class="btn-icon">⏹️</span>
                    <span>STOP</span>
                </button>
                <button class="restart" onclick="botAction('${bot.id}', 'restart')">
                    <span class="btn-icon">🔄</span>
                    <span>RESTART</span>
                </button>
                <button class="delete" onclick="deleteBot('${bot.id}')">
                    <span class="btn-icon">🗑</span>
                    <span>DELETE</span>
                </button>
            </div>

            <div class="live-console">
                <div class="console-header">
                    <span>📟 TERMINAL LOGS</span>
                    <span id="live-${bot.id}" class="console-live">● LIVE</span>
                </div>
                <pre class="console" id="console-${bot.id}">Console ready...</pre>
            </div>
        </div>
    `).join("");

    bots.forEach(bot => {
        loadFiles(bot.id);
        loadConsole(bot.id);
    });

    updateBotStats();
}

async function loadFiles(id){
    try{
        const response = await fetch("/bot/" + id + "/files");
        const files = await response.json();
        const select = document.getElementById("entry-" + id);
        if(!select) return;
        select.innerHTML = "";

        if(!Array.isArray(files) || files.length === 0){
            select.innerHTML = "<option>No Python file</option>";
            return;
        }

        files.forEach(file => {
            const option = document.createElement("option");
            option.value = file;
            option.textContent = file;
            select.appendChild(option);
        });

        const bot = bots.find(x => x.id === id);
        if(bot && bot.entry) select.value = bot.entry;

        select.onchange = function(){ setEntry(id, this.value); };
    } catch(error){ console.error("File loading error:", error); }
}

async function openEditorModal(botId){
    const select = document.getElementById("entry-" + botId);
    if(!select || !select.value || select.value === "No Python file"){
        alert("Please select a valid Python file to edit.");
        return;
    }

    currentEditingBotId = botId;
    currentEditingFileName = select.value;

    const titleBox = document.getElementById("modalFileName");
    const codeArea = document.getElementById("modalFileCode");
    const modal = document.getElementById("editorModal");

    if(titleBox) titleBox.textContent = "Editing: " + currentEditingFileName;
    if(codeArea) codeArea.value = "Loading text content...";
    if(modal) {
        // Lock body scroll tightly to prevent jump
        scrollYPosition = window.scrollY;
        document.body.style.position = 'fixed';
        document.body.style.top = `-${scrollYPosition}px`;
        document.body.style.width = '100%';
        modal.classList.add("active");
    }

    try{
        const response = await fetch("/bot/" + botId + "/file-content?file=" + encodeURIComponent(currentEditingFileName));
        const data = await response.json();
        if(data.ok && codeArea) codeArea.value = data.content || "";
        else if(codeArea) codeArea.value = "# Failed to load file text.";
    } catch(error){
        if(codeArea) codeArea.value = "# Server connection error while reading file.";
    }
}

function closeEditorModal(){
    const modal = document.getElementById("editorModal");
    if(modal) {
        modal.classList.remove("active");
        // Restore scroll position
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.width = '';
        window.scrollTo(0, scrollYPosition);
    }
    currentEditingBotId = null;
    currentEditingFileName = null;
}

async function saveModalCode(){
    if(!currentEditingBotId || !currentEditingFileName) return;
    const codeArea = document.getElementById("modalFileCode");
    if(!codeArea) return;

    if(!confirm(`Save and apply changes to "${currentEditingFileName}"?`)) return;

    try{
        const response = await fetch("/bot/" + currentEditingBotId + "/save-file", {
            method:"POST",
            headers:{ "Content-Type": "application/json" },
            body: JSON.stringify({ filename: currentEditingFileName, content: codeArea.value })
        });
        const data = await response.json();
        if(data.ok){
            alert("File updated successfully.");
            closeEditorModal();
        } else alert(data.error || "Failed to replace file content");
    } catch(error){ alert("Server connection failed during save"); }
}

async function loadConsole(id){
    try{
        const response = await fetch("/bot/" + id + "/log");
        if(!response.ok) return;
        const data = await response.json();
        const box = document.getElementById("console-" + id);
        if(!box) return;

        if(data && typeof data.log === "string"){
            box.textContent = data.log || "Console ready...";
            box.scrollTop = box.scrollHeight;
        }
    } catch(error){ console.error("Console loading error:", error); }
}

async function setEntry(id, entry){
    try{
        const response = await fetch("/bot/" + id + "/entry", {
            method:"POST",
            headers:{ "Content-Type": "application/json" },
            body: JSON.stringify({ entry: entry })
        });
        const data = await response.json();
        if(!data.ok) alert(data.error || "Failed to save start file");
    } catch(error){ alert("Server connection failed"); }
}

async function botAction(id, actionName){
    try{
        const response = await fetch("/bot/" + id + "/" + actionName, { method:"POST" });
        const data = await response.json();
        if(!data.ok){
            alert(data.error || data.message || "Action failed");
            return;
        }
        updateStatus(id, actionName === "stop" ? "STOPPED" : "RUNNING");
    } catch(error){ alert("Server connection failed"); }
}

function updateStatus(id, status){
    const box = document.getElementById("status-" + id);
    const live = document.getElementById("live-" + id);
    const bot = bots.find(x => x.id === id);

    if(bot) bot.status = status;

    if(box){
        box.textContent = status;
        box.classList.remove("running", "crashed");
        if(status === "RUNNING") box.classList.add("running");
        if(status === "CRASHED") box.classList.add("crashed");
    }

    if(live){
        live.classList.remove("active");
        if(status === "RUNNING"){
            live.textContent = "● LIVE";
            live.classList.add("active");
        } else {
            live.textContent = "● " + status;
        }
    }
    updateBotStats();
}

async function deleteBot(id){
    if(!confirm("Permanently delete this bot?")) return;
    try{
        const response = await fetch("/bot/" + id, { method:"DELETE" });
        const data = await response.json();
        if(!data.ok){
            alert(data.error || "Delete failed");
            return;
        }
        location.reload();
    } catch(error){ alert("Server connection failed"); }
}

document.getElementById("uploadForm").addEventListener("submit", async function(event){
    event.preventDefault();
    const formData = new FormData(this);
    try{
        const response = await fetch("/upload", { method:"POST", body:formData });
        const data = await response.json();
        if(!data.ok){
            alert(data.error || "Upload failed");
            return;
        }
        location.reload();
    } catch(error){ alert("Server connection failed"); }
});

socket.on("connect", function(){
    bots.forEach(bot => {
        socket.emit("join", { bot_id: bot.id });
    });
});

socket.on("log", function(data){
    const box = document.getElementById("console-" + data.bot_id);
    const live = document.getElementById("live-" + data.bot_id);
    if(!box) return;

    if(box.textContent === "Console ready...") box.textContent = "";
    box.textContent += (box.textContent ? "\n" : "") + data.line;
    box.scrollTop = box.scrollHeight;

    if(live){
        live.textContent = "● LIVE";
        live.classList.add("active");
    }
});

socket.on("status", function(data){
    updateStatus(data.bot_id, data.status);
});

renderBots();
updateBotStats();
</script>

</body>
</html>
